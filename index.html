<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תחרות הדיאטה המשפחתית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Frank+Ruhl+Libre:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#1b2a23;--muted:#6c756e;--line:#e7dec9;--accent:#1f7a58;--accent2:#b88a2e;--gold:#b88a2e;--gold2:#e6c778;--neg:#b5483c;--hero1:#0f4a3a;--hero2:#1f7a58;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a16;--card:#17241f;--ink:#f1ede2;--muted:#a2b0a6;--line:#2a3b33;--accent:#3fbf8c;--accent2:#e0b955;--gold:#e0b955;--gold2:#f3dd9b;--neg:#e5877b;--hero1:#0b3a2d;--hero2:#16694c}}
:root[data-theme="dark"]{--bg:#0f1a16;--card:#17241f;--ink:#f1ede2;--muted:#a2b0a6;--line:#2a3b33;--accent:#3fbf8c;--accent2:#e0b955;--gold:#e0b955;--gold2:#f3dd9b;--neg:#e5877b;--hero1:#0b3a2d;--hero2:#16694c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Assistant","Heebo",Arial,sans-serif;line-height:1.55;font-size:17px;overflow-x:hidden}
h1,h2,.name,.wk-t,.stat b,.pct,.ti b,.ch-h b{font-family:"Frank Ruhl Libre","David Libre",Georgia,serif}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 56px}
/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,var(--hero1),var(--hero2),var(--hero1));background-size:220% 220%;animation:flow 14s ease-in-out infinite;color:#fff;border-radius:0 0 34px 34px;padding:44px 20px 86px;text-align:center;border-bottom:2px solid var(--gold)}
.hero-in{position:relative;z-index:1}
.orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.35;animation:float 9s ease-in-out infinite}
.o1{width:220px;height:220px;background:var(--gold2);top:-60px;right:-40px}
.o2{width:260px;height:260px;background:#63d6a6;bottom:-120px;left:-50px;animation-delay:-4s}
.crest{font-size:42px;display:inline-block;animation:swing 4s ease-in-out infinite;transform-origin:50% 0}
.hero h1{margin:6px 0 6px;font-size:clamp(30px,7vw,52px);font-weight:900;letter-spacing:.3px;background:linear-gradient(100deg,#fff 20%,var(--gold2) 45%,#fff 70%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
.hero p{margin:0;opacity:.92;font-weight:300;font-size:19px}
.badges{margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.week-badge{display:inline-block;background:rgba(255,255,255,.14);border:1px solid rgba(230,199,120,.55);padding:6px 18px;border-radius:99px;font-size:14px;backdrop-filter:blur(4px)}
.hbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.hbtns button{background:linear-gradient(180deg,#fff,#f1ebdb);color:#0f4a3a;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25)}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(20,40,30,.06)}
h2{font-size:27px;margin:44px 0 14px;font-weight:700;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
#weekly{margin:-52px 0 16px;position:relative;border-color:var(--gold);animation:glow 3.5s ease-in-out infinite}
.wk{text-align:center}.wk-t{font-size:clamp(22px,5.2vw,32px);font-weight:900}.wk-s{color:var(--muted);margin-top:4px}.wk-q{margin:12px 0 0;font-weight:600;font-family:"Frank Ruhl Libre",serif;font-size:20px}
.wk-t .crown{display:inline-block;animation:bob 2.2s ease-in-out infinite}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:0 0 22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center;transition:transform .3s,box-shadow .3s}
.stat:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(20,40,30,.12)}
.stat b{display:block;font-size:30px;color:var(--accent);font-weight:900}
.stat span{font-size:14px;color:var(--muted)}
.lb{display:grid;gap:12px}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;transition:transform .3s,box-shadow .3s}
.row:hover{transform:translateX(-4px) translateY(-2px);box-shadow:0 12px 26px rgba(20,40,30,.12)}
.row.first{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 25%,transparent)}
.row.first .name{background:linear-gradient(100deg,var(--ink),var(--gold),var(--ink));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
.row,.stat,tbody tr{animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*80ms)}
.av{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:27px;overflow:hidden;flex:none;border:2px solid var(--gold)}
.av img{width:100%;height:100%;object-fit:cover}
.name{font-weight:700;font-size:21px}
.sub{font-size:13px;color:var(--muted)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;transition:width 1.6s cubic-bezier(.2,.8,.2,1);background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);background-size:60% 100%;background-repeat:no-repeat;animation:sweep 2.6s linear infinite}
.pct{font-size:30px;font-weight:900;direction:ltr}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;text-align:center}
th,td{padding:11px 8px;border-bottom:1px solid var(--line);font-size:16px}
th{color:var(--gold);font-weight:700;font-family:"Frank Ruhl Libre",serif;font-size:18px}
td:first-child,th:first-child{text-align:right;font-weight:600}
.win{background:color-mix(in srgb,var(--gold) 26%,transparent);border-radius:8px;font-weight:800}
.neg{color:var(--neg)}
tfoot td{font-weight:800;border-bottom:0}
.chart svg{width:100%;height:auto;display:block}
.chart svg text{font-family:"Assistant",Arial,sans-serif}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
.legend{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:8px;font-size:15px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-inline-end:6px}
.replay{font-size:14px;padding:4px 14px;margin-inline-start:auto;order:3}
/* tickers */
.ticker{overflow:hidden;direction:ltr;border-radius:20px;background:var(--card);border:1px solid var(--line);padding:16px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.track{display:flex;width:max-content;animation:marq var(--dur,60s) linear infinite}
.ticker:hover .track{animation-play-state:paused}
.ticker.rev .track{animation-direction:reverse}
.ti{direction:rtl;white-space:nowrap;padding:0 20px;font-size:18px;display:inline-flex;gap:9px;align-items:center}
.ti em{font-style:normal;font-size:24px}
.ti b{color:var(--gold);font-size:19px}
.ti small{color:var(--muted);font-size:14px}
.sep{color:var(--gold);align-self:center;font-size:14px}
.empty{color:var(--muted);text-align:center;padding:10px;direction:rtl}
/* reveal */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
/* buttons, forms */
button{font:inherit;cursor:pointer;border:0;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 80%,#000));color:#fff;padding:9px 20px;border-radius:99px;transition:transform .2s,box-shadow .2s,filter .2s}
button:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.2);filter:brightness(1.06)}
button:active{transform:scale(.96)}
button.sec{background:var(--line);color:var(--ink)}
button:disabled{opacity:.6}
dialog{border:1px solid var(--gold);border-radius:24px;background:var(--card);color:var(--ink);width:94%;max-width:450px;padding:20px;max-height:92vh;overflow:auto}
dialog[open]{animation:pop .4s cubic-bezier(.2,.9,.3,1.15)}
dialog::backdrop{background:rgba(8,20,15,.6);backdrop-filter:blur(3px)}
dialog h3{margin:0 0 10px;font-family:"Frank Ruhl Libre",serif;font-size:24px}
dialog label{display:block;font-size:14px;margin:8px 0;color:var(--muted)}
dialog input,dialog textarea,dialog select{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.msg{font-size:13px;color:var(--neg);min-height:18px;margin-top:6px}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.emo{display:flex;flex-wrap:wrap;gap:6px}
.emo button{background:var(--bg);color:inherit;font-size:22px;padding:4px 9px;border:2px solid transparent}
.emo button.on{border-color:var(--gold)}
.me{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.box{border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:12px}
.close{float:left;background:none;color:var(--muted);padding:0 6px;font-size:20px;box-shadow:none}
.pl{width:100%;text-align:right;margin:6px 0;background:var(--bg);color:var(--ink);display:flex;gap:10px;align-items:center}
.hrow{display:grid;grid-template-columns:1.3fr 1fr .8fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.hrow button{padding:2px 8px}
/* chat */
#chatBtn{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:20;padding:16px 11px;border-radius:0 18px 18px 0;background:linear-gradient(180deg,var(--accent),#0f4a3a);box-shadow:4px 6px 20px rgba(0,0,0,.3);writing-mode:vertical-rl;font-weight:700;animation:nudge 6s ease-in-out infinite}
#chatBtn:hover{transform:translateY(-50%) translateX(4px)}
#chatBadge{position:absolute;top:-6px;right:-6px;writing-mode:horizontal-tb;background:var(--neg);color:#fff;border-radius:99px;min-width:22px;height:22px;font-size:12px;display:flex;align-items:center;justify-content:center;font-style:normal}
#chat{position:fixed;left:0;top:0;bottom:0;width:min(380px,94vw);z-index:40;background:var(--card);border-right:2px solid var(--gold);box-shadow:8px 0 40px rgba(0,0,0,.35);transform:translateX(-105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#chat.open{transform:none}
.ch-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-size:20px}
.ch-h .close{float:none}
.ch-b{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.ch-day{text-align:center;color:var(--muted);font-size:12px;margin:4px 0}
.cm{display:flex;gap:8px;align-items:flex-end;animation:rise .4s both}
.cm.mine{flex-direction:row-reverse}
.cb{max-width:78%;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:6px 12px}
.cm.mine .cb{background:color-mix(in srgb,var(--accent) 18%,var(--card));border-color:var(--accent)}
.cb b{font-size:13px;color:var(--gold)}.cb p{margin:0;word-break:break-word;white-space:pre-wrap}.cb small{color:var(--muted);font-size:11px}
.cm .av{width:30px;height:30px;font-size:16px;border-width:1px}
.ch-f{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.ch-f input{flex:1;font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:99px;background:var(--bg);color:var(--ink)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti span{position:absolute;top:-40px;animation:fall 3.4s linear forwards}
@keyframes flow{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(24px,18px)}}
@keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes shine{to{background-position:-200% 0}}
@keyframes glow{0%,100%{box-shadow:0 10px 30px rgba(20,40,30,.08),0 0 0 0 transparent}50%{box-shadow:0 10px 34px rgba(184,138,46,.28),0 0 22px 2px rgba(184,138,46,.25)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-6px) rotate(6deg)}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes sweep{from{background-position:-60% 0}to{background-position:200% 0}}
@keyframes marq{to{transform:translateX(-50%)}}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:none}}
@keyframes nudge{0%,90%,100%{transform:translateY(-50%)}94%{transform:translateY(-50%) translateX(6px)}97%{transform:translateY(-50%) translateX(0)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}.ticker{overflow-x:auto}}
</style>
</head>
<body>
<header class="hero">
  <div class="orb o1"></div><div class="orb o2"></div>
  <div class="hero-in">
    <div class="crest">⚖️</div>
    <h1>תחרות הדיאטה המשפחתית</h1>
    <p>כל שבוע שוקלים · מי ירד הכי הרבה אחוזים?</p>
    <div class="badges"><span class="week-badge" id="badge" hidden></span><span class="week-badge" id="next"></span></div>
    <div class="hbtns"><button id="bAdd">➕ הוספת משתמש</button><button id="bMe">👤 האזור האישי</button></div>
  </div>
</header>
<main class="wrap">
  <div id="notice"></div>
  <div class="card reveal" id="weekly"></div>
  <section class="stats" id="stats"></section>
  <div id="pending"></div>
  <h2 class="reveal">🏆 טבלת המובילים</h2>
  <div class="lb" id="lb"></div>
  <h2 class="reveal">🔥 סטטיסטיקות מעניינות</h2>
  <div class="ticker reveal" id="tkFacts"></div>
  <h2 class="reveal">📈 המסע של כולנו <button class="sec replay" onclick="chartPlay()">▶ נגן שוב</button></h2>
  <div class="card chart reveal" id="chartCard"><div id="chart"></div><div class="legend" id="legend"></div></div>
  <h2 class="reveal">🗓️ כל השבועות</h2>
  <div class="card tw reveal"><table id="tbl"></table></div>
  <h2 class="reveal">💬 מילות המנצחים והבדיחות</h2>
  <div class="ticker reveal" id="tkQuotes"></div>
  <div class="ticker rev reveal" id="tkJokes" style="margin-top:12px"></div>
</main>
<button id="chatBtn" aria-label="צ'אט המשפחה">💬 צ'אט<i id="chatBadge" hidden></i></button>
<aside id="chat" aria-label="צ'אט המשפחה">
  <div class="ch-h"><b>💬 צ'אט המשפחה</b><button class="close" onclick="chatToggle(false)">✕</button></div>
  <div class="ch-b" id="chatList"></div>
  <div class="ch-f"><input id="chatIn" maxlength="300" placeholder="כתבו הודעה..."><button id="chatSend">שליחה</button></div>
</aside>
<dialog id="dlg"><div id="dbody"></div></dialog>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COLORS=["#e07a5f","#3d85c6","#2f9e6e","#a26bd4","#e0a030","#d6559a","#3aa7b5","#7a8f3a"];
const EMOS=["🦁","🐯","🐻","🦊","🐼","🦉","🐬","🦄","🌟","🚀","🍀","🏆"];
const PHOTO_RE=/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/;
let MEM=[],WK=[],ENT=[],D=null;
const round2=x=>Math.round(x*100)/100,fmt=x=>(x<0?"−":"")+Math.abs(x).toFixed(2)+"%";
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function friday(d){let x=5-d.getDay();if(x>3)x-=7;if(x<-3)x+=7;const r=new Date(d);r.setDate(r.getDate()+x);return r}
const GU=[..."אבגדהוזחט"],GT=[..."יכלמנסעפצ"];
function gem(n){if(n===15)return"ט״ו";if(n===16)return"ט״ז";const t=n>=10?GT[Math.floor(n/10)-1]+(n%10?GU[n%10-1]:""):GU[n-1];return t.length>1?t.slice(0,-1)+"״"+t.slice(-1):t+"׳"}
function hl(id){const p=new Intl.DateTimeFormat("he-u-ca-hebrew",{day:"numeric",month:"long",timeZone:"UTC"}).formatToParts(new Date(id+"T12:00:00Z"));return gem(+p.find(x=>x.type==="day").value)+" "+p.find(x=>x.type==="month").value}
const dm=id=>id.slice(8)+"."+id.slice(5,7);
function av(m,s){const z=s?`width:${s}px;height:${s}px;`:"";
 if(m.photo&&PHOTO_RE.test(m.photo))return `<div class="av" style="${z}"><img src="${m.photo}" alt=""></div>`;
 return `<div class="av" style="${z}background:${esc(m.c||"#999")}33">${esc(EMOS.includes(m.av)?m.av:(m.name||"?")[0])}</div>`}

/* ===== חישוב נתונים ===== */
const closedW=id=>{const t=new Date(id+"T00:00:00Z");t.setUTCDate(t.getUTCDate()+2);return ymd(new Date())>=t.toISOString().slice(0,10)};
function derive(){
 const ms=MEM.map(d=>({id:d.id,...d.data()}));
 const ws=WK.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.id<b.id?-1:1);
 const em={};ENT.forEach(d=>{const x=d.data();em[x.wk+"__"+x.m]=x});
 ms.forEach(m=>m.tot=ws.reduce((s,w)=>s+((em[w.id+"__"+m.id]||{}).pct||0),0));
 ms.sort((a,b)=>b.tot-a.tot);
 const fr=ymd(friday(new Date()));if(!ws.length||ws[ws.length-1].id<fr)ws.push({id:fr,virtual:true});
 ws.forEach(w=>{
  w.v=ms.map(m=>{const e=em[w.id+"__"+m.id];return e&&e.pct!=null?e.pct:null});
  w.has=ms.map(m=>!!em[w.id+"__"+m.id]);
  const a=w.v.map((x,i)=>[x,i]).filter(z=>z[0]!==null);w.win=[];w.low=[];
  if(a.length>=1){const mx=Math.max(...a.map(z=>z[0])),mn=Math.min(...a.map(z=>z[0]));
   w.win=a.filter(z=>z[0]===mx).map(z=>z[1]);w.low=a.length<2||mx===mn?[]:a.filter(z=>z[0]===mn).map(z=>z[1])}
  const cl=ms.map((m,i)=>m.claimed?i:-1).filter(i=>i>=0);
  w.done=!w.virtual&&(closedW(w.id)||(cl.length>0&&cl.every(i=>w.has[i])));
  w.wait=cl.filter(i=>!w.has[i]);
 });
 return{ms,ws};
}

/* ===== סטטיסטיקות (מחושבות מהנתונים, מוצגות רק אם נכונות) ===== */
function facts(P,W){
 const R=W.filter(w=>!w.virtual&&w.has.some(Boolean)),out=[];
 if(!R.length||!P.length)return out;
 const N=i=>esc(P[i].name),idx=P.map((_,i)=>i),names=a=>a.map(N).join(", ");
 const WR=R.filter(w=>w.done);
 const wins=idx.map(i=>WR.filter(w=>w.win.includes(i)).length),mw=Math.max(...wins);
 if(mw>0)out.push(["👑","הכי הרבה ניצחונות שבועיים",names(idx.filter(i=>wins[i]===mw))+" ("+mw+")"]);
 const wl=idx.filter(i=>wins[i]>0).sort((a,b)=>wins[b]-wins[a]);
 if(wl.length>1)out.push(["🏆","טבלת הניצחונות",wl.map(i=>N(i)+" "+wins[i]).join(" · ")]);
 const run=(f,L=R)=>idx.map(i=>{let b=0,c=0;L.forEach(w=>{if(f(w,i)){c++;b=Math.max(b,c)}else c=0});return[b,c]});
 const ws=run((w,i)=>w.win.includes(i),WR);
 const live=idx.filter(i=>ws[i][1]>=2);
 if(live.length)out.push(["🔥","רצף ניצחונות פעיל",live.map(i=>N(i)+" · "+ws[i][1]+" שבועות ברצף").join(" | ")]);
 const bw=Math.max(...ws.map(z=>z[0])),bl=idx.filter(i=>ws[i][0]===bw);
 if(bw>=2&&!bl.some(i=>ws[i][1]===bw))out.push(["🏅","שיא רצף ניצחונות",names(bl)+" · "+bw+" שבועות"]);
 const ls=run((w,i)=>w.v[i]!==null&&w.v[i]>0),bm=Math.max(...ls.map(z=>z[0]));
 if(bm>=3)out.push(["💚","הרצף הארוך ביותר של ירידות",names(idx.filter(i=>ls[i][0]===bm))+" · "+bm+" שבועות"]);
 let best=null,worst=null;
 R.forEach(w=>w.v.forEach((v,i)=>{if(v===null)return;if(!best||v>best.v)best={v,i,w};if(!worst||v<worst.v)worst={v,i,w}}));
 if(best)out.push(["🚀","שבוע השיא",N(best.i)+" · "+fmt(best.v)+" ("+esc(hl(best.w.id))+")"]);
 if(worst&&worst.v<0)out.push(["📉","השבוע הקשה ביותר",N(worst.i)+" · "+fmt(worst.v)+" ("+esc(hl(worst.w.id))+")"]);
 const sec=idx.map(()=>0);
 R.forEach(w=>{const a=w.v.map((v,i)=>[v,i]).filter(z=>z[0]!==null).sort((x,y)=>y[0]-x[0]);
  if(a.length>=2&&a[1][0]<a[0][0]&&(a.length<3||a[1][0]>a[2][0]))sec[a[1][1]]++});
 const ms=Math.max(...sec);
 if(ms>=2)out.push(["🥈","המקום השני",names(idx.filter(i=>sec[i]===ms))+" · "+ms+" פעמים"]);
 const cnt=idx.map(i=>R.filter(w=>w.v[i]!==null).length),mc=Math.max(...cnt);
 if(mc>=3)out.push(["⚖️","הכי הרבה שקילות",names(idx.filter(i=>cnt[i]===mc))+" · "+mc]);
 const av=idx.filter(i=>cnt[i]>=3).map(i=>[i,P[i].tot/cnt[i]]).sort((a,b)=>b[1]-a[1]);
 if(av.length)out.push(["📊","הממוצע השבועי הגבוה ביותר",N(av[0][0])+" · "+fmt(av[0][1])]);
 const pr=idx.filter(i=>P[i].goalPct>0&&P[i].tot>0).map(i=>[i,P[i].tot/P[i].goalPct*100]).sort((a,b)=>b[1]-a[1]);
 if(pr.length)out.push(["🎯","הכי קרוב ליעד",N(pr[0][0])+" · "+pr[0][1].toFixed(1)+"% מהדרך"]);
 if(P.length>=2)out.push(["📏","הפער בין המקום הראשון לשני",N(0)+" מול "+N(1)+" · "+(P[0].tot-P[1].tot).toFixed(2)+"%"]);
 return out}

 <div class="g2"><label>תאריך שקילה<input id="w_d" type="date" value="${fr}"></label><label>המשקל שלך השבוע (ק״ג)<input id="w_k" type="number" step="0.1" inputmode="decimal"></label></div>
 <div class="msg" id="msg"></div><div class="actions"><button onclick="A.week(0)">עדכון</button><button class="sec" onclick="A.week(1)">דילגתי השבוע</button></div>
 <div class="note">מספיק לכתוב את המשקל. האתר מחשב כמה ירדת ומעדכן את העמוד הראשי באחוזים. הקילוגרמים נשארים כאן.</div></div>
 ${histHtml}
 <details class="box"><summary><b>הגדרות</b></summary>
 <label>שם<input id="s_n" value="${esc(m.name)}" maxlength="20"></label><label>סמל</label>${emoRow()}
 <label>תמונת פרופיל<input type="file" accept="image/*" onchange="A.photo(this)"></label>
 <div class="g2"><label>משקל התחלתי<input id="s_s" type="number" step="0.1" value="${p.start}"></label><label>משקל יעד<input id="s_g" type="number" step="0.1" value="${p.goal}"></label></div>
 <label>מייל לתזכורת שבועית (נשמר פרטי)<input id="s_e" type="email" value="${esc(p.email||"")}"></label>
 <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="s_r" ${p.remind?"checked":""} style="width:auto"> שלחו לי תזכורת בכל יום שישי בבוקר</label>
 <label>סיסמה חדשה (ריק = ללא שינוי)<input id="s_p" type="password"></label>
 <div class="msg" id="msg2"></div><div class="actions"><button onclick="A.save()">שמירת הגדרות</button><button class="sec" onclick="A.save(1)">שמירה ושליחת מייל לדוגמה</button><button class="sec" onclick="A.out()">יציאה</button></div></details>`)};
A.out=()=>{delete TOK[cur];saveTok();A.close()};
A.week=async skip=>{
 const dt=friday(new Date($("w_d").value+"T12:00:00"));
 const r=await api("week",{token:TOK[cur],wk:ymd(dt),label:hl(ymd(dt)),skip:!!skip,weight:$("w_k").value});
 if(r.err)return err(r.err);
 A.flash=r.lost==null?"":(r.lost>0?`ירדת ${r.lost} ק״ג (${r.pct}%) 🎉`:r.lost<0?`עלית ${Math.abs(r.lost)} ק״ג (${Math.abs(r.pct)}%)`:"ללא שינוי לעומת הפעם הקודמת");
 await refresh();A.area()};
A.save=async t=>{
 const r=await api("settings",{token:TOK[cur],name:$("s_n").value,av:emo,photo,start:parseFloat($("s_s").value),goal:parseFloat($("s_g").value),password:$("s_p").value,email:$("s_e").value,remind:$("s_r").checked});
 if(r.err)return alert(r.err);
 if(t){const q=await api("testmail",{token:TOK[cur]});alert(q.err||"נשלח מייל לדוגמה. בדקו גם בספאם.")}
 await refresh();A.area()};
A.post=async(k,wk)=>{const r=await api("post",{token:TOK[cur],kind:k,wk,text:$((k==="quote"?"q_":"j_")+wk).value});if(r.err)return alert(r.err);await refresh();A.area()};
A.edit=async wk=>{const v=prompt("המשקל (ק״ג) לשבוע "+hl(wk)+" ("+dm(wk)+")",A.hist[wk]==null?"":A.hist[wk]);if(v===null)return;const r=await api("week",{token:TOK[cur],wk,label:hl(wk),skip:false,weight:v});if(r.err)return alert(r.err);await refresh();A.area()};
A.editp=async wk=>{const v=prompt("האחוז של שבוע "+hl(wk)+" ("+dm(wk)+"). ירידה במספר חיובי, עלייה במינוס",A.pcts[wk]==null?"":A.pcts[wk]);if(v===null)return;const r=await api("pct",{token:TOK[cur],wk,pct:v});if(r.err)return alert(r.err);await refresh();A.area()};
A.delp=async wk=>{if(!confirm("למחוק את השבוע "+hl(wk)+" מההיסטוריה?"))return;const r=await api("pct",{token:TOK[cur],wk,del:true});if(r.err)return alert(r.err);await refresh();A.area()};
A.del=async wk=>{if(!confirm("למחוק את השקילה של שבוע "+hl(wk)+"?"))return;const r=await api("del",{token:TOK[cur],wk});if(r.err)return alert(r.err);await refresh();A.area()};


/* ===== אנימציות ===== */
const reduced=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
function countUp(){if(reduced)return;document.querySelectorAll(".cnt").forEach(el=>{const to=+el.dataset.to,dec=+el.dataset.dec,suf=el.dataset.suf||"",pre=el.dataset.pre||"",t0=performance.now();
 const f=now=>{const k=Math.min(1,(now-t0)/1500),e=1-Math.pow(1-k,3);el.textContent=pre+(to*e).toFixed(dec)+suf;if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
function confetti(){if(reduced)return;const box=document.createElement("div");box.className="confetti";const E=["🎉","✨","🏆","⭐","🎊"];
 for(let i=0;i<28;i++){const s=document.createElement("span");s.textContent=E[i%5];s.style.cssText=`left:${Math.random()*100}%;animation-delay:${Math.random()*1.3}s;font-size:${16+Math.random()*18}px`;box.appendChild(s)}
 document.body.appendChild(box);setTimeout(()=>box.remove(),5200)}
let CHD=null,chartRaf=0,chartSeen=false;
const eb=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
function chartDraw(k){if(!CHD)return;const{P,W,n,cum,w,h,pl,pr,mx,mn,X,Y}=CHD;
 let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="גרף ירידה מצטברת">`;
 for(let v=mn;v<=mx;v++)s+=`<line x1="${pl}" x2="${w-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}%</text>`;
 W.forEach((x,i)=>s+=`<text x="${X(i)}" y="${h-12}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(hl(x.id))}</text>`);
 P.forEach((m,q)=>{const loc=i=>Math.max(0,Math.min(1,k*1.7-(i/Math.max(1,n-1))*.7));
  const pts=cum[q].map((v,i)=>[X(i),Y(v*(k>=1?1:eb(loc(i))))]);
  s+=`<polyline fill="none" stroke="${esc(m.c)}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" points="${pts.map(z=>z.join(",")).join(" ")}"/>`;
  pts.forEach((z,i)=>{if(W[i].has[q]){const r=4.2*Math.min(1,loc(i)*2.2);s+=`<circle cx="${z[0]}" cy="${z[1]}" r="${r.toFixed(2)}" fill="${esc(m.c)}"/>`}});
  if(k>=1){const z=pts[n-1];s+=`<circle class="pulse" cx="${z[0]}" cy="${z[1]}" r="6" fill="${esc(m.c)}"/>`}});
 $("chart").innerHTML=s+"</svg>"}
function chartPlay(){if(!CHD)return;chartSeen=true;cancelAnimationFrame(chartRaf);if(reduced){chartDraw(1);return}
 const t0=performance.now(),step=now=>{const k=Math.min(1,(now-t0)/2600);chartDraw(k);if(k<1)chartRaf=requestAnimationFrame(step)};chartRaf=requestAnimationFrame(step)}
{const io="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);if(e.target.id==="chartCard")chartPlay()}}),{threshold:.12}):null;
 document.querySelectorAll(".reveal").forEach(el=>io?io.observe(el):el.classList.add("in"));
 if(!io)setTimeout(chartPlay,400)}

/* ===== צ'אט ===== */
const CH={open:false,msgs:[],err:null,stick:false};let chTick=0;
const seen=()=>{try{return +localStorage.getItem("chatseen")||0}catch(e){return 0}};
const setSeen=t=>{try{localStorage.setItem("chatseen",String(t))}catch(e){}};
function chatTok(){const ids=Object.keys(TOK),id=(cur&&TOK[cur])?cur:ids[0];return id?{id,t:TOK[id]}:null}
function chatRender(){
 const c=chatTok(),L=$("chatList");
 if(!c){L.innerHTML=`<div class="empty">כדי להשתתף בצ'אט צריך להיכנס.<br><br><button onclick="chatToggle(false);$('bMe').click()">כניסה לאזור האישי</button></div>`;$("chatIn").disabled=$("chatSend").disabled=true;return}
 $("chatIn").disabled=$("chatSend").disabled=false;
 let last="";
 const h=CH.msgs.map(m=>{const d=new Date(m.ts),day=d.toLocaleDateString("he-IL"),mem=memOf(m.by),mine=m.by===c.id;
  const sep=day!==last?`<div class="ch-day">${esc(day)}</div>`:"";last=day;
  return sep+`<div class="cm ${mine?"mine":""}">${av(mem,30)}<div class="cb"><b>${esc(mem.name||"")}</b><p>${esc(m.text)}</p><small>${esc(d.toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"}))}</small></div></div>`}).join("");
 const atBottom=L.scrollTop+L.clientHeight>=L.scrollHeight-60;
 L.innerHTML=h||`<div class="empty">עוד אין הודעות. תהיו הראשונים!</div>`;
 if(atBottom||CH.stick)L.scrollTop=L.scrollHeight;CH.stick=false}
function chatBadge(){const c=chatTok(),k=c?CH.msgs.filter(m=>m.ts>seen()&&m.by!==c.id).length:0;$("chatBadge").hidden=!k||CH.open;$("chatBadge").textContent=k}
async function chatLoad(){const c=chatTok();if(!c){chatRender();return}
 const r=await api("chat",{token:c.t});
 if(r.err){CH.err=r.err;if(/להיכנס/.test(r.err)){delete TOK[c.id];saveTok()}chatRender();return}
 CH.err=null;CH.msgs=r.msgs;chatRender();if(CH.open&&CH.msgs.length)setSeen(CH.msgs[CH.msgs.length-1].ts);chatBadge()}
function chatToggle(o){CH.open=o===undefined?!CH.open:o;$("chat").classList.toggle("open",CH.open);if(CH.open){CH.stick=true;chatRender();chatLoad()}else chatBadge()}
async function chatSend(){const c=chatTok(),i=$("chatIn"),t=i.value.trim();if(!c||!t)return;i.value="";
 const r=await api("say",{token:c.t,text:t});if(r.err)return alert(r.err);CH.stick=true;chatLoad()}
$("chatBtn").onclick=()=>chatToggle();$("chatSend").onclick=chatSend;$("chatIn").onkeydown=e=>{if(e.key==="Enter")chatSend()};
setInterval(()=>{chTick++;if(CH.open||chTick%6===0)chatLoad()},5000);

render();refresh();
setInterval(()=>{if(!$("dlg").open)refresh()},20000);
</script>
</body>
</html>
